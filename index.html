<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e94560">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="מקום פשוט לצפייה בסרטונים ובערוצים שההורה אישר.">
  <title>סרטונים לילדים</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function () {
        // Browsing still works if installation/storage is unavailable.
      });
    }
  </script>
  <style>
    :root { color-scheme:dark; --bg:#1a1a2e; --surface:#24243c; --accent:#e94560; --text:#faf9ff; --muted:#c3c1d5; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html { min-height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font:18px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
    button { font:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    button:disabled { cursor:wait; opacity:.6; }
    button:focus-visible, a:focus-visible { outline:4px solid #ffe389; outline-offset:5px; }
    .shell { max-width:1440px; margin:auto; padding:32px clamp(18px,4vw,56px) 40px; }
    header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px; margin-bottom:30px; }
    .brand { display:flex; align-items:center; gap:16px; }
    .brand-icon { width:62px; height:62px; border-radius:20px; box-shadow:0 8px 28px #e9456033; }
    h1 { font-size:clamp(25px,4vw,38px); line-height:1.2; margin:0 0 6px; }
    .subtitle { color:var(--muted); margin:0; font-size:16px; }
    .button { border:1px solid #55516c; border-radius:16px; min-height:58px; padding:12px 22px; color:var(--text); background:var(--surface); font-weight:650; }
    .button:hover { background:#33314c; }
    .primary { background:var(--accent); border-color:var(--accent); color:white; }
    .primary:hover { background:#cb304c; }
    .install { margin-inline-start:10px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
    .toolbar h2 { font-size:22px; margin:0; }
    #count { font-size:15px; color:var(--muted); }
    .status { display:flex; align-items:center; gap:12px; color:var(--muted); margin:0 0 22px; padding:16px 20px; border:1px solid #393650; border-radius:18px; background:#202035; }
    .status p { margin:0; }
    .spinner { width:23px; height:23px; border:3px solid #5b526b; border-top-color:var(--accent); border-radius:50%; flex-shrink:0; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:24px; }
    .card { position:relative; overflow:hidden; text-align:start; border:1px solid #3d3b55; background:var(--surface); padding:0; border-radius:22px; color:var(--text); transition:transform .16s, border-color .16s; }
    .card:hover { transform:translateY(-3px); border-color:var(--accent); }
    .thumb { background:linear-gradient(135deg,#3e344e,#27253e); position:relative; aspect-ratio:16/9; display:block; overflow:hidden; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .play { position:absolute; bottom:14px; inset-inline-start:14px; width:48px; height:48px; border-radius:50%; background:var(--accent); display:grid; place-items:center; box-shadow:0 4px 20px #0005; }
    .play svg { width:22px; height:22px; }
    .card-title { display:block; padding:18px 20px 22px; font-size:20px; font-weight:650; min-height:94px; overflow-wrap:anywhere; }
    .empty { text-align:center; border:1px dashed #55516c; border-radius:24px; padding:64px 24px; }
    .empty-icon { font-size:48px; color:var(--accent); margin-bottom:12px; }
    .empty h2 { margin:0 0 12px; font-size:24px; }
    .empty p { margin:0; color:var(--muted); }
    #more { display:block; margin:28px auto 0; min-width:190px; }
    footer { text-align:center; margin-top:40px; font-size:14px; color:var(--muted); }
    .overlay { position:fixed; inset:0; z-index:100; background:#10101c; display:flex; flex-direction:column; height:100%; height:100dvh; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
    .player-bar { padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left)); display:flex; gap:18px; align-items:center; border-bottom:1px solid #343248; }
    #back { flex-shrink:0; min-width:120px; }
    #player-title { margin:0; font-size:clamp(16px,2.5vw,22px); white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
    .player-state { min-height:64px; display:flex; align-items:center; gap:14px; padding:10px 18px; flex-wrap:wrap; color:var(--muted); font-size:16px; }
    .player-state p { margin:0; flex:1; }
    #next-player { min-height:48px; padding:8px 18px; font-size:16px; }
    .frame-wrap { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; }
    iframe { width:100%; height:100%; border:0; background:#000; }
    #player-error { text-align:center; padding:24px; max-width:560px; }
    #player-error p { color:var(--muted); }
    noscript { display:block; padding:30px; text-align:center; }
    @media (min-width:700px) and (max-width:1100px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:480px) { .shell { padding-top:22px; } .brand-icon { width:52px; height:52px; } header { gap:18px; } .actions { width:100%; } .grid { gap:18px; } .player-bar { gap:12px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <div class="shell" id="app">
    <header>
      <div class="brand">
        <img class="brand-icon" src="./icons/icon-192.png" alt="" width="62" height="62">
        <div><h1>סרטונים לילדים</h1><p class="subtitle">בוחרים סרטון, ונהנים יחד</p></div>
      </div>
      <div class="actions">
        <button class="button" id="refresh" type="button">↻ רענון הסרטונים</button>
        <button class="button primary install" id="install" type="button" hidden>הוספה למסך הבית</button>
      </div>
    </header>
    <main>
      <div class="toolbar"><h2>מה נצפה היום?</h2><span id="count"></span></div>
      <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true">
        <span class="spinner" id="spinner" aria-hidden="true"></span><p id="status-text">רגע קטן, הסרטונים בדרך…</p>
      </div>
      <div class="grid" id="grid" aria-label="הסרטונים המאושרים"></div>
      <section class="empty" id="empty" hidden>
        <div class="empty-icon" aria-hidden="true">▶</div>
        <h2 id="empty-title">עוד מעט יהיו כאן סרטונים</h2>
        <p id="empty-text">אחרי שההורה יוסיף סרטונים או ערוצים מאושרים, הם יופיעו כאן.</p>
      </section>
      <button class="button" id="more" type="button" hidden>עוד סרטונים</button>
    </main>
    <footer>המקום שלנו לסרטונים שאושרו מראש</footer>
  </div>
  <section class="overlay" id="player" role="dialog" aria-modal="true" aria-labelledby="player-title" tabindex="-1" hidden>
    <div class="player-bar"><button class="button primary" id="back" type="button"><bdi dir="ltr">← חזרה</bdi></button><h2 id="player-title">הסרטון שלנו</h2></div>
    <div class="player-state" role="status" aria-live="polite">
      <span class="spinner" id="player-spinner" aria-hidden="true" hidden></span>
      <p id="player-message"></p><button class="button" id="next-player" type="button" hidden>נסו נגן אחר</button>
    </div>
    <div class="frame-wrap">
      <iframe id="video-frame" title="נגן הסרטון המאושר" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer" allowfullscreen hidden></iframe>
      <div id="player-error" hidden><h2>הסרטון לא זמין כרגע</h2><p>אפשר לחזור ולבחור סרטון אחר, או לנסות שוב מאוחר יותר.</p><button class="button" id="retry-video" type="button">נסו שוב</button></div>
    </div>
  </section>
  <noscript>כדי לצפות בסרטונים, יש להפעיל JavaScript בדפדפן.</noscript>
  <script>
    'use strict';
    // Parent configuration: change instance addresses ONLY here.
    // Listed in https://docs.invidious.io/instances/ on 2026-10-05.
    // Listing is not proof of CORS, embed, or playback availability.
    const INVIDIOUS_INSTANCES = [
      'https://invidious.nerdvpn.de',
      'https://invidious.tiekoetter.com',
      'https://yt.chocolatemoo53.com',
      'https://invidious.f5.si'
    ];
    const SETTINGS = Object.freeze({
      requestTimeoutMs: 8000,
      channelBudgetMs: 120000,
      maxPagesPerChannel: 100,
      maxVideosWithoutLimit: 5000,
      parallelChannels: 3,
      cardsPerPage: 60,
      playerWaitMs: 18000,
      refreshOnReturnMs: 5 * 60 * 1000
    });
    const VIDEO_ID = /^[A-Za-z0-9_-]{11}$/;
    const CHANNEL_ID = /^UC[A-Za-z0-9_-]{22}$/;
    const CACHE_KEY = 'kidsYoutubeVideos';
    const INSTANCE_KEY = 'kidsYoutubeLastInstance';
    const SCOPE = new URL('./', location.href).href;
    const $ = id => document.getElementById(id);
    const ui = Object.fromEntries(['app','grid','count','status','status-text','spinner','empty','empty-title','empty-text','refresh','more','player','back','player-title','video-frame','player-spinner','player-message','next-player','player-error','retry-video','install'].map(id => [id, $(id)]));
    let displayed = new Map();
    let visibleCount = SETTINGS.cardsPerPage;
    let loading = false;
    let lastLoad = 0;
    let installPrompt = null;
    let playback = null;
    let playerTimer = null;
    let returnFocus = null;
    let playerSequence = 0;

    function storageGet(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } }
    function storageSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (_) { return false; } }
    function cleanTitle(title) { return typeof title === 'string' && title.trim() ? title.trim().slice(0,300) : 'סרטון מאושר'; }
    function normalizeConfig(raw) {
      if (!raw || !Array.isArray(raw.videos) || !Array.isArray(raw.channels)) throw new Error('INVALID_CONFIG');
      const videos = new Map();
      const channels = new Map();
      let skipped = 0;
      for (const video of raw.videos) {
        if (!video || !VIDEO_ID.test(video.id)) { skipped++; continue; }
        if (!videos.has(video.id)) videos.set(video.id, {id:video.id, title:cleanTitle(video.title)});
      }
      for (const channel of raw.channels) {
        if (!channel || !CHANNEL_ID.test(channel.id) || (channel.maxVideos !== undefined && (!Number.isSafeInteger(channel.maxVideos) || channel.maxVideos < 1))) { skipped++; continue; }
        channels.set(channel.id, {id:channel.id, name:cleanTitle(channel.name), ...(channel.maxVideos === undefined ? {} : {maxVideos:channel.maxVideos})});
      }
      return {videos:[...videos.values()], channels:[...channels.values()], skipped};
    }
    function readSnapshot() {
      const snapshot = storageGet(CACHE_KEY);
      if (!snapshot || snapshot.version !== 1 || snapshot.scope !== SCOPE || !snapshot.config || !snapshot.channelLists) return null;
      try {
        snapshot.config = normalizeConfig(snapshot.config);
        snapshot.channelLists = pruneLists(snapshot.config, snapshot.channelLists);
        return snapshot;
      } catch (_) { return null; }
    }
    function cleanChannelVideos(rows, channel) {
      const result = new Map();
      const limit = channel.maxVideos === undefined ? SETTINGS.maxVideosWithoutLimit : channel.maxVideos;
      for (const row of Array.isArray(rows) ? rows : []) {
        if (!row || !VIDEO_ID.test(row.id) || row.channelId !== channel.id) continue;
        if (!result.has(row.id)) result.set(row.id, {id:row.id, title:cleanTitle(row.title), channelId:channel.id});
        if (result.size >= limit) break;
      }
      return [...result.values()];
    }
    function pruneLists(config, lists) {
      const output = Object.create(null);
      for (const channel of config.channels) output[channel.id] = cleanChannelVideos(lists[channel.id], channel);
      return output;
    }
    function mergeVideos(config, lists) {
      const result = new Map(config.videos.map(v => [v.id, {...v}]));
      for (const channel of config.channels) {
        for (const video of cleanChannelVideos(lists[channel.id], channel)) {
          if (!result.has(video.id)) result.set(video.id, video);
        }
      }
      return result;
    }
    function saveSnapshot(config, lists) {
      return storageSet(CACHE_KEY, {version:1, scope:SCOPE, savedAt:Date.now(), config, channelLists:pruneLists(config, lists)});
    }
    function status(text, busy = false) {
      ui['status-text'].textContent = text;
      ui.status.hidden = !text;
      ui.spinner.hidden = !busy;
    }
    function render(config, lists) {
      const focusId = document.activeElement && document.activeElement.dataset.videoId;
      displayed = mergeVideos(config, lists);
      const fragment = document.createDocumentFragment();
      for (const video of [...displayed.values()].slice(0, visibleCount)) {
        const card = document.createElement('button');
        card.type = 'button'; card.className = 'card'; card.dataset.videoId = video.id;
        card.setAttribute('aria-label', 'צפייה: ' + video.title);
        const thumb = document.createElement('span'); thumb.className = 'thumb';
        const image = document.createElement('img');
        image.src = 'https://img.youtube.com/vi/' + video.id + '/hqdefault.jpg';
        image.alt = ''; image.loading = 'lazy'; image.decoding = 'async'; image.referrerPolicy = 'no-referrer';
        image.addEventListener('error', () => { image.hidden = true; }, {once:true});
        const play = document.createElement('span'); play.className = 'play'; play.setAttribute('aria-hidden','true');
        play.innerHTML = '<svg viewBox="0 0 24 24" fill="white"><path d="M7 3v18l15-9z"/></svg>';
        const title = document.createElement('span'); title.className = 'card-title'; title.dir = 'auto'; title.textContent = video.title;
        thumb.append(image, play); card.append(thumb, title); fragment.append(card);
      }
      ui.grid.replaceChildren(fragment);
      ui.count.textContent = displayed.size ? displayed.size.toLocaleString('he-IL') + ' סרטונים לבחירה' : '';
      ui.more.hidden = displayed.size <= visibleCount;
      ui.empty.hidden = displayed.size > 0 || loading;
      if (focusId) {
        const target = [...ui.grid.children].find(card => card.dataset.videoId === focusId);
        if (target) target.focus({preventScroll:true});
      }
    }
    function orderedInstances() {
      const last = storageGet(INSTANCE_KEY);
      const preferred = last && last.scope === SCOPE && INVIDIOUS_INSTANCES.includes(last.url) ? last.url : null;
      return [...new Set([preferred, ...INVIDIOUS_INSTANCES].filter(Boolean))].filter(url => {
        try { const parsed = new URL(url); return parsed.protocol === 'https:' && parsed.origin === url; } catch (_) { return false; }
      });
    }
    function rememberInstance(url) { storageSet(INSTANCE_KEY, {scope:SCOPE, url}); }
    async function fetchJson(url, timeout = SETTINGS.requestTimeoutMs, signal) {
      const controller = new AbortController();
      const abort = () => controller.abort();
      if (signal) { if (signal.aborted) abort(); else signal.addEventListener('abort', abort, {once:true}); }
      const timer = setTimeout(abort, Math.max(1,timeout));
      try {
        const response = await fetch(url, {cache:'no-store', credentials:'omit', referrerPolicy:'no-referrer', signal:controller.signal});
        if (!response.ok) throw new Error('REQUEST_FAILED');
        // Keep the deadline active while reading/parsing the response body.
        return await response.json();
      } finally {
        clearTimeout(timer);
        if (signal) signal.removeEventListener('abort', abort);
      }
    }
    async function channelPage(channelId, continuation, deadline) {
      const path = '/api/v1/channels/' + encodeURIComponent(channelId) + '/videos';
      const candidates = orderedInstances();
      // A channel-specific error must never disable an instance for other channels.
      for (const base of candidates) {
        if (Date.now() >= deadline) break;
        try {
          const url = new URL(path, base);
          if (continuation) url.searchParams.set('continuation', continuation);
          const data = await fetchJson(url.href, Math.min(SETTINGS.requestTimeoutMs, deadline - Date.now()));
          if (!data || !Array.isArray(data.videos) || (data.continuation != null && typeof data.continuation !== 'string')) throw new Error('INVALID_CHANNEL_RESPONSE');
          rememberInstance(base);
          return data;
        } catch (_) { /* Try the next instance, independently for each channel/page. */ }
      }
      throw new Error('CHANNEL_UNAVAILABLE');
    }
    async function loadChannel(channel) {
      const deadline = Date.now() + SETTINGS.channelBudgetMs;
      const videos = new Map();
      const seenTokens = new Set();
      const limit = channel.maxVideos === undefined ? SETTINGS.maxVideosWithoutLimit : channel.maxVideos;
      let continuation = null;
      let complete = false;
      let limited = false;
      let failed = false;
      for (let page = 0; page < SETTINGS.maxPagesPerChannel; page++) {
        try {
          const data = await channelPage(channel.id, continuation, deadline);
          for (const row of data.videos) {
            if (!row || !VIDEO_ID.test(row.videoId) || (row.authorId && row.authorId !== channel.id)) continue;
            if (!videos.has(row.videoId)) videos.set(row.videoId, {id:row.videoId, title:cleanTitle(row.title), channelId:channel.id});
            if (videos.size >= limit) break;
          }
          if (videos.size >= limit) { complete = true; limited = channel.maxVideos === undefined && !!data.continuation; break; }
          if (!data.continuation) { complete = true; break; }
          if (seenTokens.has(data.continuation)) { limited = true; break; }
          seenTokens.add(data.continuation);
          continuation = data.continuation;
        } catch (_) { failed = true; break; }
      }
      if (!complete && !failed) limited = true;
      return {videos:[...videos.values()], complete, limited, failed};
    }
    async function parallelMap(items, worker) {
      let index = 0;
      await Promise.all(Array.from({length:Math.min(SETTINGS.parallelChannels, items.length)}, async () => {
        while (index < items.length) { const item = items[index++]; await worker(item); }
      }));
    }
    async function loadApp() {
      if (loading || !ui.player.hidden) return;
      loading = true; lastLoad = Date.now(); visibleCount = SETTINGS.cardsPerPage;
      ui.refresh.disabled = true; ui.grid.setAttribute('aria-busy','true');
      ui.empty.hidden = true; status('רגע קטן, הסרטונים בדרך…', true);
      const previous = readSnapshot();
      let config = null;
      let lists = Object.create(null);
      let freshConfig = false;
      let invalidConfig = false;
      try {
        let raw;
        try { raw = await fetchJson('./videos.json'); }
        catch (error) {
          // A served but malformed JSON file must not resurrect revoked approvals.
          if (error instanceof SyntaxError) { invalidConfig = true; throw error; }
          if (!previous) throw error;
          config = previous.config; lists = previous.channelLists;
        }
        if (!config) {
          try { config = normalizeConfig(raw); }
          catch (error) { invalidConfig = true; throw error; }
          freshConfig = true;
          lists = pruneLists(config, previous ? previous.channelLists : {});
          // Persist removals immediately, even if subsequent channel requests fail.
          saveSnapshot(config, lists);
        }
        // Manual approvals appear immediately; cached channels only after fresh config validation.
        render(config, lists);
        if (!freshConfig) {
          status('מוצגת הרשימה השמורה. כדי לקבל סרטונים ועדכונים חדשים, התחברו לאינטרנט ורעננו.');
          return;
        }
        let finished = 0, failures = 0, limited = 0;
        let cacheSaved = true;
        if (config.channels.length) status('טוענים את הסרטונים מהערוצים…', true);
        await parallelMap(config.channels, async channel => {
          const result = await loadChannel(channel);
          if (result.failed) failures++;
          if (result.limited) limited++;
          lists[channel.id] = result.complete ? result.videos : cleanChannelVideos([...result.videos, ...(lists[channel.id] || [])], channel);
          if (!saveSnapshot(config, lists)) cacheSaved = false;
          render(config, lists);
          status('טוענים את הסרטונים מהערוצים… ' + (++finished) + ' מתוך ' + config.channels.length, true);
        });
        if (!saveSnapshot(config, lists)) cacheSaved = false;
        const messages = [];
        if (failures && displayed.size) messages.push('חלק מהערוצים אינם זמינים כרגע. הסרטונים הזמינים והשמורים כאן בשבילכם.');
        else if (failures) messages.push('הסרטונים אינם זמינים כרגע. נסו שוב מאוחר יותר.');
        if (limited) messages.push('מוצגים הסרטונים שכבר התקבלו. אפשר לרענן מאוחר יותר.');
        if (!cacheSaved) messages.push('לא הצלחנו לשמור את הרשימה במכשיר. הצפייה עדיין זמינה עם חיבור לאינטרנט.');
        status(messages.join(' '));
      } catch (_) {
        displayed = new Map(); ui.grid.replaceChildren(); ui.count.textContent = ''; ui.more.hidden = true;
        if (invalidConfig) {
          // Replace the local snapshot with an empty whitelist on a malformed current file.
          saveSnapshot({videos:[], channels:[]}, {});
          status('הרשימה זקוקה לעדכון של ההורה. נסו שוב אחרי העדכון.');
        } else status('הסרטונים אינם זמינים כרגע. נסו שוב מאוחר יותר.');
      } finally {
        loading = false; ui.refresh.disabled = false; ui.grid.removeAttribute('aria-busy');
        ui.empty.hidden = displayed.size > 0;
        ui['empty-title'].textContent = invalidConfig ? 'מחכים לרשימת הסרטונים' : (config && !config.videos.length && !config.channels.length ? 'עוד מעט יהיו כאן סרטונים' : 'הסרטונים אינם זמינים כרגע');
        ui['empty-text'].textContent = config && !config.videos.length && !config.channels.length ? 'אחרי שההורה יוסיף סרטונים או ערוצים מאושרים, הם יופיעו כאן.' : 'אפשר לרענן ולנסות שוב מאוחר יותר.';
      }
    }

    function playerMessage(text, busy = false) {
      ui['player-message'].textContent = text; ui['player-spinner'].hidden = !busy;
    }
    function playerUnavailable() {
      ui['video-frame'].src = ''; ui['video-frame'].hidden = true;
      ui['player-error'].hidden = false; ui['next-player'].hidden = true;
      playerMessage('לא הצלחנו לפתוח את הסרטון. נסו שוב מאוחר יותר.');
    }
    async function tryPlayer() {
      if (!playback) return;
      const session = playback;
      const sequence = ++playerSequence;
      if (session.controller) session.controller.abort();
      session.controller = new AbortController();
      clearTimeout(playerTimer);
      ui['video-frame'].src = ''; ui['video-frame'].hidden = true;
      ui['player-error'].hidden = true; ui['next-player'].hidden = true;
      playerMessage('פותחים את הסרטון…', true);
      while (session.index < session.instances.length) {
        const base = session.instances[session.index++];
        try {
          // iframe load is NOT proof of playback: CORS metadata is a preflight only.
          const data = await fetchJson(base + '/api/v1/videos/' + encodeURIComponent(session.video.id), SETTINGS.requestTimeoutMs, session.controller.signal);
          if (!data || data.error || data.videoId !== session.video.id) throw new Error('VIDEO_UNAVAILABLE');
          if (playback !== session || sequence !== playerSequence) return;
          const url = new URL('/embed/' + encodeURIComponent(session.video.id), base);
          url.search = 'autoplay=1&related_videos=false&continue=0&comments=false&iv_load_policy=3';
          ui['video-frame'].src = url.href; ui['video-frame'].hidden = false;
          rememberInstance(base);
          // A child can report a stream/embed failure that cross-origin JS cannot inspect.
          ui['next-player'].hidden = session.index >= session.instances.length;
          playerTimer = setTimeout(() => {
            if (playback === session && sequence === playerSequence) playerMessage('אם הסרטון לא מתחיל, אפשר לנסות נגן אחר או לחזור ולבחור סרטון אחר.');
          }, SETTINGS.playerWaitMs);
          return;
        } catch (_) {
          if (playback !== session || sequence !== playerSequence || session.controller.signal.aborted) return;
        }
      }
      if (playback === session && sequence === playerSequence) playerUnavailable();
    }
    function openPlayer(id) {
      const video = displayed.get(id);
      if (!video || playback) return;
      returnFocus = document.activeElement;
      playback = {video, instances:orderedInstances(), index:0, controller:null};
      ui['player-title'].textContent = video.title;
      ui['video-frame'].title = 'צפייה: ' + video.title;
      ui.player.hidden = false; ui.app.inert = true; ui.app.setAttribute('aria-hidden','true');
      document.body.style.overflow = 'hidden'; ui.back.focus();
      history.pushState({kidsYoutubePlayer:true}, '', location.href);
      tryPlayer();
    }
    function closePlayer(fromHistory = false) {
      if (!playback) return;
      if (playback.controller) playback.controller.abort();
      playback = null; playerSequence++; clearTimeout(playerTimer);
      // Stop the iframe BEFORE hiding the overlay.
      ui['video-frame'].src = '';
      ui['video-frame'].hidden = true;
      ui.player.hidden = true; ui.app.inert = false; ui.app.removeAttribute('aria-hidden');
      document.body.style.overflow = '';
      if (returnFocus && returnFocus.isConnected) returnFocus.focus({preventScroll:true});
      if (!fromHistory && history.state && history.state.kidsYoutubePlayer) history.back();
    }
    ui.grid.addEventListener('click', event => {
      const card = event.target.closest('button[data-video-id]');
      if (card && ui.grid.contains(card)) openPlayer(card.dataset.videoId);
    });
    ui.refresh.addEventListener('click', loadApp);
    ui.more.addEventListener('click', () => {
      visibleCount += SETTINGS.cardsPerPage;
      const snapshot = readSnapshot();
      if (snapshot) render(snapshot.config, snapshot.channelLists);
      else {
        // Storage may be disabled: render the in-memory approved list instead.
        render({videos:[...displayed.values()], channels:[]}, {});
      }
    });
    ui.back.addEventListener('click', () => closePlayer());
    window.addEventListener('popstate', () => closePlayer(true));
    ui['next-player'].addEventListener('click', tryPlayer);
    ui['retry-video'].addEventListener('click', () => { if (playback) { playback.index = 0; tryPlayer(); } });
    ui['video-frame'].addEventListener('error', () => { if (playback) tryPlayer(); });
    // Browsers also fire load for error pages; never label this event "playing".
    ui['video-frame'].addEventListener('load', () => {
      if (!playback || ui['video-frame'].hidden) return;
      playerMessage('אפשר ללחוץ על ▶ בתוך הנגן כדי להתחיל. אם אינו עובד, נסו נגן אחר.');
    });
    document.addEventListener('keydown', event => {
      if (ui.player.hidden) return;
      if (event.key === 'Escape') { event.preventDefault(); closePlayer(); }
      if (event.key === 'Tab') {
        const controls = [...ui.player.querySelectorAll('button,iframe')].filter(el => !el.hidden && !el.closest('[hidden]'));
        const first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt = event; ui.install.hidden = false; });
    ui.install.addEventListener('click', async () => {
      if (!installPrompt) return;
      try { await installPrompt.prompt(); await installPrompt.userChoice; } catch (_) { /* Use Chrome's install menu if necessary. */ }
      installPrompt = null; ui.install.hidden = true;
    });
    window.addEventListener('appinstalled', () => { installPrompt = null; ui.install.hidden = true; });
    window.addEventListener('online', loadApp);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Date.now() - lastLoad > SETTINGS.refreshOnReturnMs) loadApp();
    });
    if (history.state && history.state.kidsYoutubePlayer) history.replaceState(null, '', location.href);
    loadApp();
  </script>
</body>
</html>
