// Pure Gradle packaging: opening Android Studio does not require Node.
def webRoot = rootProject.projectDir.parentFile
def outputAssets = layout.buildDirectory.dir('generated/kidsAssets')
def outputRes = layout.buildDirectory.dir('generated/kidsRes')
tasks.register('prepareKidsAssets') {
    inputs.files(['index.html','app.js','providers.js','manifest.json','android/native-adapter.js',
        'android/LICENSE','android/THIRD_PARTY_NOTICES.md'].collect { new File(webRoot,it) })
    inputs.files(fileTree(new File(webRoot,'icons')) { include '*.png' })    outputs.dir outputAssets
    outputs.dir outputRes
    doLast {
        def once = { String text, String needle, String replacement ->
            text = text.replace('\r\n','\n')
            if (text.split(java.util.regex.Pattern.quote(needle),-1).length != 2)
                throw new GradleException('Frontend adapter anchor changed')
            text.replace(needle,replacement)
        }
        def target = outputAssets.get().asFile
        project.delete(target); target.mkdirs()
        String html = new File(webRoot,'index.html').getText('UTF-8')
        html = once(html,"if ('serviceWorker' in navigator)","if (false && 'serviceWorker' in navigator)")
        html = once(html,'<script src="./providers.js?v=20261006h" defer></script>',
            '<script src="./providers.js?v=20261006h" defer></script>\n  <script src="./native-adapter.js" defer></script>')
        String app = new File(webRoot,'app.js').getText('UTF-8')
        app = once(app,'''function optionalStorage() { try { return localStorage; } catch (_) { return null; } }
function parentToken(){try{return localStorage.getItem('kidsParentToken')||sessionStorage.getItem('kidsParentToken')||'';}catch(_){return '';}}
async function providerFetch(input,options={}) {
  if(!PARENT_CATALOG){catalogMetrics.providerCalls++;return fetch(input,options);}
  let target;try{target=new URL(String(input),location.href);}catch(_){throw new Error('INVALID_PARENT_PROVIDER');}
  if(!INVIDIOUS_INSTANCES.includes(target.origin))throw new Error('INVALID_PARENT_PROVIDER');
  const value=parentToken(),headers={...(options.headers||{}),...(value?{Authorization:'Bearer '+value}:{})};
  catalogMetrics.providerCalls++;
  const response=await fetch(PARENT_API+'?action=provider&target='+encodeURIComponent(target.href),{...options,headers});
  if(response.status===401){
    try{window.parent.postMessage({type:'kids-parent-auth-expired'},location.origin);}catch(_){}
    return response;
  }
  const upstream=Number(response.headers.get('X-Kids-Provider-Status')||0);
  if(upstream>=400&&upstream<=599){
    const body=await response.text();
    return new Response(body,{status:upstream,headers:{'Content-Type':'application/json'}});
  }
  return response;
}
const providers = KidsProviders.createManager({instances:INVIDIOUS_INSTANCES, scope:SCOPE, fetcher:providerFetch, storage:optionalStorage(), timeout:SETTINGS.requestTimeoutMs, budget:SETTINGS.channelBudgetMs});''',
            '''function optionalStorage() { try { return localStorage; } catch (_) { return null; } }
const providers = KidsNative.createManager();''')
        app = once(app,'function openPlayer(id) {\n  const video = displayed.get(id);',
            'function openPlayer(id) {\n  const video = displayed.get(id);\n  if (video && (getApprovedVideos().has(id) || getApprovedChannels().has(video.channelId))) KidsNative.openPlayer(id);\n  return;\n  // Browser player remains in the source for website regression checks.')
        html = once(html,'''<meta id="app-csp" http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.youtube.com https://i.ytimg.com https://yt3.ggpht.com https://yt3.googleusercontent.com https://invidious.f5.si https://invidious.tiekoetter.com https://yt.chocolatemoo53.com; connect-src 'self' https://jxhelpxhrmwvzrrfrjuh.supabase.co https://invidious.f5.si https://invidious.tiekoetter.com https://yt.chocolatemoo53.com; font-src 'self'; media-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">''','''<meta id="app-csp" http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.youtube.com https://i.ytimg.com https://yt3.ggpht.com https://yt3.googleusercontent.com; connect-src 'self' https://jxhelpxhrmwvzrrfrjuh.supabase.co; font-src 'self'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">''')

        new File(target,'index.html').setText(html,'UTF-8')
        new File(target,'app.js').setText(app,'UTF-8')
        ['android/LICENSE':'LICENSE.txt','android/THIRD_PARTY_NOTICES.md':'THIRD_PARTY_NOTICES.txt',
            'android/native-adapter.js':'native-adapter.js','providers.js':'providers.js','manifest.json':'manifest.json'].each { src,dst ->
            new File(target,dst).bytes = new File(webRoot,src).bytes
        }
        project.copy { from new File(webRoot,'icons'); into new File(target,'icons') }
        def icons = new File(outputRes.get().asFile,'mipmap'); icons.mkdirs()
        new File(icons,'ic_launcher.png').bytes = new File(webRoot,'icons/icon-192.png').bytes
    }
}
preBuild.dependsOn tasks.named('prepareKidsAssets')
