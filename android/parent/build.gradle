plugins { id 'com.android.application' }
android {
    namespace 'il.kidsyoutube.parent'
    compileSdk 36
    defaultConfig {
        applicationId 'il.kidsyoutube.parent'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2-parent-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java','../app/src/main/java']
            java.includes = ['**/Parent*.java','**/ShareInput.java','**/ListEditor.java',
                '**/GithubListStore.java','**/TokenVault.java','**/ApprovalPolicy.java',
                '**/ExtractorDownloader.java','**/RequestScope.java']
            assets.srcDirs = ['../app/src/main/assets', '../app/build/generated/kidsAssets']
        }
    }
    preBuild.dependsOn ':app:prepareKidsAssets'
}
dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

