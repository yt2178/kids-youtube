plugins { id 'com.android.application' }
def kidsStaging = project.findProperty('kidsStaging')?.toString() == 'true'
def stagingBackend = project.findProperty('kidsBackendUrl')?.toString() ?: ''
def productionBackend = 'https://jxhelpxhrmwvzrrfrjuh.supabase.co/functions/v1/kids-youtube'
if(kidsStaging){
    if(!(stagingBackend ==~ /^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/kids-youtube$/)
            || stagingBackend == productionBackend)
        throw new GradleException('Staging requires a distinct, validated Supabase URL (-PkidsBackendUrl). Production is forbidden.')
}
def kidsBackend = kidsStaging ? stagingBackend : productionBackend
android {
    namespace 'il.kidsyoutube'
    compileSdk 36
    defaultConfig {
        applicationId kidsStaging ? 'il.kidsyoutube.staging' : 'il.kidsyoutube'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3-beta'
        resValue 'string','kids_list_url',kidsBackend+'?action=list&format=text'
        resValue 'string','kids_backend_url',kidsBackend
        resValue 'string','kids_app_label',kidsStaging ? 'סרטונים לילדים — בדיקה' : 'סרטונים לילדים'
        manifestPlaceholders = [kidsDeepLinkScheme: kidsStaging ? 'kidsyoutube-staging' : 'kidsyoutube']
        resValue 'string','kids_deep_link_scheme',kidsStaging ? 'kidsyoutube-staging' : 'kidsyoutube'
        def candidateSha=System.getenv('KIDS_BUILD_SHA') ?: 'local'
        resValue 'string','kids_build_sha',(candidateSha ==~ /[a-f0-9]{40}/ ? candidateSha : 'local')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets.main.assets.srcDirs = ['src/main/assets', "$buildDir/generated/kidsAssets"]
    sourceSets.main.res.srcDirs += ["$buildDir/generated/kidsRes"]
    testOptions.unitTests.returnDefaultValues = true
}
apply from: rootProject.file('prepare-assets.gradle')
dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
