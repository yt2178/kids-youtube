plugins { id 'com.android.application' }
def productionBackend = 'https://jxhelpxhrmwvzrrfrjuh.supabase.co/functions/v1/kids-youtube'
android {
    namespace 'il.kidsyoutube'
    compileSdk 36
    defaultConfig {
        applicationId 'il.kidsyoutube'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3-beta'
        resValue 'string','kids_list_url',productionBackend+'?action=list&format=native'
        resValue 'string','kids_backend_url',productionBackend
        resValue 'string','kids_app_label','סרטונים לילדים'
        resValue 'string','kids_deep_link_scheme','kidsyoutube'
        def candidateSha=System.getenv('KIDS_BUILD_SHA')
        if(!candidateSha){
            try {
                def process=new ProcessBuilder('git','rev-parse','HEAD').directory(rootProject.projectDir).redirectErrorStream(true).start()
                candidateSha=process.waitFor(3,java.util.concurrent.TimeUnit.SECONDS) && process.exitValue()==0 ? process.inputStream.text.trim() : 'local'
            }catch(Exception ignored){candidateSha='local'}
        }
        resValue 'string','kids_build_sha',(candidateSha ==~ /[a-f0-9]{40}/ ? candidateSha : 'local')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets.main.assets.srcDirs = ['src/main/assets', "$buildDir/generated/kidsAssets"]
    sourceSets.main.res.srcDirs += ["$buildDir/generated/kidsRes"]
    testOptions.unitTests.returnDefaultValues = true
}
apply from: rootProject.file('prepare-assets.gradle')
dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
