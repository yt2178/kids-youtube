pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io'; content { includeGroupByRegex 'com\\.github\\.(TeamNewPipe|teamnewpipe).*' } }
    }
}
rootProject.name = 'KidsYouTube'
include ':app'
// The optional previous companion is retained, but parents now use the browser page.
if (providers.gradleProperty('includeParentCompanion').orNull == 'true') include ':parent'
