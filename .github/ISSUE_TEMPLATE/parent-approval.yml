name: אישור תוכן לילדים
description: הוספת סרטון או ערוץ וביטול אישור — להורים מורשים בלבד
title: "[אישור הורה] עדכון הרשימה"
body:
  - type: markdown
    attributes:
      value: "בדקו את התוכן ב־YouTube לפני אישור. רק בעל הריפו או הורה בעל הרשאת כתיבה יכולים לשנות את הרשימה. הפרטים וההערות ציבוריים."
  - type: input
    id: link
    attributes:
      label: קישור
      description: קישור אחד בלבד של סרטון או ערוץ
    validations:
      required: true
  - type: input
    id: operation
    attributes:
      label: פעולה
      description: הוספה לרשימה או ביטול אישור — כפי שבחרתם בעמוד ההורה
      value: הוספה לרשימה
    validations:
      required: true
  - type: input
    id: note
    attributes:
      label: הערה
      description: הערה לעצמכם, ללא מידע אישי
  - type: checkboxes
    id: confirmed
    attributes:
      label: בדיקה ואישור
      options:
        - label: בדקתי את הקישור ואת התוכן. באישור ערוץ אני מאשר גם את הסרטונים החדשים שלו.
          required: true
