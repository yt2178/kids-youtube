name: Test and build Kids YouTube family apps
on:
  push:
    branches: [android-newpipe-proof, main]
    paths: ['android/**', 'tests/**', 'index.html', 'app.js', 'providers.js', 'icons/**', 'manifest.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-family-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Website and bridge regressions
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Native unit tests and both APKs
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :parent:testDebugUnitTest :app:assembleDebug :parent:assembleDebug --stacktrace
      - name: Verify native reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          counts = {}
          for module in ['app','parent']:
              files = list(Path('android',module,'build/test-results/testDebugUnitTest').glob('*.xml'))
              assert files, f'Missing test reports: {module}'
              count = 0
              for file in files:
                  report = ET.parse(file).getroot()
                  assert all(int(report.get(key,'0')) == 0 for key in ['failures','errors','skipped']), file
                  count += int(report.get('tests','0'))
              counts[module] = count
          assert counts['app'] >= 10 and counts['parent'] >= 25, counts
          print(counts)
          Path('android/native-test-counts.json').write_text(__import__('json').dumps(counts))
          PY
      - name: Package download files
        run: |
          mkdir -p family
          cp android/app/build/outputs/apk/debug/app-debug.apk family/Kids-YouTube.apk
          cp android/parent/build/outputs/apk/debug/parent-debug.apk family/Kids-YouTube-Parent.apk
          cp android/native-test-counts.json family/
          cd family
          sha256sum *.apk > SHA256SUMS.txt
      - name: APKs and native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-youtube-family-beta
          if-no-files-found: warn
          path: |
            family/
            android/app/build/test-results/testDebugUnitTest/
            android/parent/build/test-results/testDebugUnitTest/
  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kids-youtube-family-beta
          path: verified
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const directory = 'verified/family/';
            const counts = JSON.parse(fs.readFileSync(directory+'native-test-counts.json','utf8'));
            if(counts.app < 10 || counts.parent < 25) throw new Error('Missing native test results');
            const tag = 'family-beta-'+context.sha.slice(0,12);
            const body = [
              'שתי אפליקציות Android: סרטונים לילדים + הוספה לילדים (להורה בלבד).',
              'YouTube → שיתוף → הוספה לילדים → בדיקת השם והתמונה → אישור.',
              'נדרש חיבור GitHub חד־פעמי בטלפון ההורה עם הרשאת כתיבה לרשימה. אין שרת נוסף או תשלום.',
              'נגן NewPipeExtractor/Media3 המקורי נשמר. המשתמש דיווח שהגרסה הקודמת מנגנת היטב; השיתוף והעיצוב החדשים עדיין דורשים בדיקה בטלפון.',
              counts.app+' בדיקות Java לילדים ו־'+counts.parent+' להורה עברו, בנוסף לבדיקות האתר/הגשר.',
              'Android 6 ומעלה ו־WebView מעודכן. אלו APK לבדיקת בטא בחתימת debug; עדכון עתידי עשוי לדרוש הסרה והתקנה מחדש.',
              'הגרסה החדשה לילדים (il.kidsyoutube) מותקנת לצד גרסת הבדיקה הקודמת (il.kidsyoutube.proof).',
              'להורה: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/blob/'+context.sha+'/PARENTS.md',
              'מקור: '+context.sha
            ].join('\n\n');
            let release;
            try { release=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data; }
            catch(e) { if(e.status!==404) throw e; release=(await github.rest.repos.createRelease({...context.repo,
              tag_name:tag,target_commitish:context.sha,name:'Kids YouTube — family beta',body,prerelease:true,draft:false})).data; }
            for(const name of ['Kids-YouTube.apk','Kids-YouTube-Parent.apk','SHA256SUMS.txt']) {
              const data=fs.readFileSync(directory+name);
              if(name.endsWith('.apk') && data.readUInt32LE(0)!==0x04034b50) throw new Error('Invalid APK');
              const existing=release.assets.find(asset=>asset.name===name);
              if(existing) { if(existing.size!==data.length) throw new Error('Existing asset mismatch'); continue; }
              const asset=await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data,
                headers:{'content-type':name.endsWith('.apk')?'application/vnd.android.package-archive':'text/plain','content-length':data.length}});
              console.log(name+'='+asset.data.browser_download_url);
            }
            await core.summary.addHeading('Family beta built and published').addLink('Downloads',release.html_url)
              .addRaw('\nNative tests: '+JSON.stringify(counts)+'\nNew parent flow requires physical phone verification.').write();
