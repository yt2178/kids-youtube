name: Test and build Kids YouTube family apps
on:
  push:
    branches: [android-newpipe-proof, main]
  pull_request:
    branches: [main]
    paths: ['android/**', 'tests/**', 'index.html', 'app.js', 'providers.js', 'icons/**', 'manifest.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-family-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Website and bridge regressions
        run: node --test tests/*.test.cjs
      - name: Verify production Supabase CORS for packaged Android origin
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --fail-with-body --silent --show-error --location             --dump-header "$headers" --output "$body" --write-out '%{http_code}'             -H 'Origin: https://appassets.androidplatform.net'             'https://jxhelpxhrmwvzrrfrjuh.supabase.co/functions/v1/kids-youtube?action=list')"
          test "$code" = "200"
          grep -qi '^access-control-allow-origin: https://appassets.androidplatform.net' "$headers"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(typeof j.list!=='string')process.exit(1)" "$body"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the default Android Studio child project with the checked-in wrapper
        env:
          KIDS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Check identical Gradle packaging and optional old companion regressions
        run: |
          node android/check-bundle.cjs
          cd android
          ./gradlew --no-daemon -PincludeParentCompanion=true :parent:testDebugUnitTest --stacktrace
      - name: Audit Java deprecations and Gradle warnings
        shell: bash
        run: |
          cat > /tmp/kids-audit-lint.init.gradle <<'EOF'
          gradle.beforeProject { project ->
              project.tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs.add('-Xlint:deprecation')
              }
          }
          EOF
          cd android
          ./gradlew --no-daemon --rerun-tasks --warning-mode all \
            --init-script /tmp/kids-audit-lint.init.gradle \
            -PincludeParentCompanion=true \
            :app:compileDebugJavaWithJavac :parent:compileDebugJavaWithJavac
      - name: Verify native reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          counts = {}
          for module in ['app','parent']:
              files = list(Path('android',module,'build/test-results/testDebugUnitTest').glob('*.xml'))
              assert files, f'Missing test reports: {module}'
              count = 0
              for file in files:
                  report = ET.parse(file).getroot()
                  assert all(int(report.get(key,'0')) == 0 for key in ['failures','errors','skipped']), file
                  count += int(report.get('tests','0'))
              counts[module] = count
          assert counts['app'] >= 10 and counts['parent'] >= 25, counts
          print(counts)
          Path('android/native-test-counts.json').write_text(__import__('json').dumps(counts))
          PY
      - name: Package download files
        run: |
          mkdir -p family
          cp android/app/build/outputs/apk/debug/app-debug.apk family/Kids-YouTube.apk
          git archive --format=zip --prefix=kids-youtube/ HEAD -o family/Kids-YouTube-AndroidStudio.zip
          cp android/native-test-counts.json family/
          cd family
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Build isolated staging app and website if staging backend is configured
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          STAGING_BACKEND_URL: https://jxhelpxhrmwvzrrfrjuh.supabase.co/functions/v1/kids-youtube-staging
          KIDS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node staging/build-static.cjs
          cd android
          ./gradlew --no-daemon -PkidsStaging=true \
            "-PkidsBackendUrl=$STAGING_BACKEND_URL" :app:assembleDebug
          cd ..
          mkdir -p staging-package
          cp android/app/build/outputs/apk/debug/app-debug.apk staging-package/Kids-YouTube-Staging.apk
          zip -q -r staging-package/Kids-YouTube-Staging-Web.zip staging-dist
          cd staging-package
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Live staging-only read/auth/catalog acceptance
        if: github.event_name == 'pull_request'
        env:
          KIDS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node staging/live-smoke.cjs
      - name: Upload isolated staging APK and PWA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kids-youtube-staging-${{ github.event.pull_request.head.sha || github.sha }}
          path: staging-package/
          if-no-files-found: error
      - name: APKs and native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-youtube-family-beta
          if-no-files-found: warn
          path: |
            family/
            android/app/build/test-results/testDebugUnitTest/
            android/parent/build/test-results/testDebugUnitTest/
  publish:
    needs: android
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kids-youtube-family-beta
          path: verified
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const directory = 'verified/family/';
            const counts = JSON.parse(fs.readFileSync(directory+'native-test-counts.json','utf8'));
            if(counts.app < 10 || counts.parent < 25) throw new Error('Missing native test results');
            const tag = 'family-beta-'+context.sha.slice(0,12);
            const body = [
              'אפליקציית הילדים ופרויקט מלא לפתיחה ב־Android Studio, בתוך אותו ריפו.',
              'הורידו Kids-YouTube-AndroidStudio.zip, חלצו ופתחו ב־Android Studio את kids-youtube/android. אין צורך ב־Node או Gradle מותקן בנפרד.',
              'להורה יש עמוד בדפדפן: סיסמה → העתקת קישור → בדיקה → הוספה או הסרה ישירה. אין צורך בחשבון GitHub או באישור ידני.',
              'התאמות למסך קטן/גדול/לרוחב, טקסט מוגדל, אזורי מערכת ומקלדת. מנגנון הניגון המקורי נשמר; השינויים החדשים דורשים גם בדיקה פיזית.',
              counts.app+' בדיקות Java לילדים ו־'+counts.parent+' בדיקות נסיגה של companion ההורה עברו, בנוסף לבדיקות האתר, הגשר ואזור ההורים בדפדפן.',
              'Android 6 ומעלה ו־WebView מעודכן. אלו APK לבדיקת בטא בחתימת debug; עדכון עתידי עשוי לדרוש הסרה והתקנה מחדש.',
              'אם גרסת בטא קודמת עם אותו מזהה מותקנת, חתימת debug חדשה עשויה לדרוש הסרה לפני התקנה.',
              'עמוד ההורים: https://yt2178.github.io/kids-youtube/parents.html',
              'תיעוד: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/blob/'+context.sha+'/PARENTS.md',
              'מקור: '+context.sha
            ].join('\n\n');
            let release;
            try { release=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data; }
            catch(e) { if(e.status!==404) throw e; release=(await github.rest.repos.createRelease({...context.repo,
              tag_name:tag,target_commitish:context.sha,name:'Kids YouTube — Android Studio + browser parent',body,prerelease:true,draft:false})).data; }
            for(const name of ['Kids-YouTube.apk','Kids-YouTube-AndroidStudio.zip','SHA256SUMS.txt']) {
              const data=fs.readFileSync(directory+name);
              if(name.endsWith('.apk') && data.readUInt32LE(0)!==0x04034b50) throw new Error('Invalid APK');
              const existing=release.assets.find(asset=>asset.name===name);
              if(existing) { if(existing.size!==data.length) throw new Error('Existing asset mismatch'); continue; }
              const asset=await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data,
                headers:{'content-type':name.endsWith('.apk')?'application/vnd.android.package-archive':'text/plain','content-length':data.length}});
              console.log(name+'='+asset.data.browser_download_url);
            }
            await core.summary.addHeading('Family beta built and published').addLink('Downloads',release.html_url)
              .addRaw('\nNative tests: '+JSON.stringify(counts)+'\nParent flow uses direct password-based backend saves.').write();
