name: Test Kids YouTube Android and packaged assets
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['android/**', 'tests/**', 'index.html', 'app.js', 'providers.js', 'icons/**', 'manifest.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-family-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Website and bridge regressions
        run: node --test tests/*.test.cjs
      - name: Verify production Supabase CORS for packaged Android origin
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --fail-with-body --silent --show-error --location             --dump-header "$headers" --output "$body" --write-out '%{http_code}'             -H 'Origin: https://appassets.androidplatform.net'             'https://jxhelpxhrmwvzrrfrjuh.supabase.co/functions/v1/kids-youtube?action=list')"
          test "$code" = "200"
          grep -qi '^access-control-allow-origin: https://appassets.androidplatform.net' "$headers"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(typeof j.list!=='string')process.exit(1)" "$body"
      - name: Probe official YouTube channel feed from CI runner
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          curl --location --silent --show-error --max-time 15 \
            -H 'Accept: application/atom+xml, application/xml' \
            --output "$body" \
            --write-out 'Official RSS HTTP=%{http_code} total_seconds=%{time_total} bytes=%{size_download}\n' \
            'https://www.youtube.com/feeds/videos.xml?channel_id=UCV6xoqUxJzkWwCbDmEwMSYw' || true
          python3 - "$body" <<'PY'
          import sys,xml.etree.ElementTree as ET
          try:
              root=ET.parse(sys.argv[1]).getroot()
              channel=root.find('{http://www.youtube.com/xml/schemas/2015}channelId')
              entries=root.findall('{http://www.w3.org/2005/Atom}entry')
              print('Official RSS parsed: channelId=',channel.text if channel is not None else 'missing','entries=',len(entries))
          except Exception as exc:
              print('Official RSS unavailable to CI runner:',type(exc).__name__)
          PY
      - name: Verify live server catalog and pinned Meir channel
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --silent --show-error --max-time 30 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Origin: https://appassets.androidplatform.net' \
            'https://jxhelpxhrmwvzrrfrjuh.supabase.co/functions/v1/kids-youtube?action=catalog')"
          test "$code" = 200
          node - "$body" <<'NODE'
          const fs=require('fs');
          const response=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Number.isSafeInteger(response.version)||!Array.isArray(response.entries))throw Error('Invalid live catalog response');
          const channel=response.entries.find(x=>x.approval_url==='https://www.youtube.com/@meirshows');
          if(!channel)throw Error('Approved Meir channel missing from live catalog');
          if(channel.item_id!=='UCV6xoqUxJzkWwCbDmEwMSYw')throw Error('Unexpected UC mapping');
          const videos=Array.isArray(channel.page)?channel.page:[];
          if(videos.some(v=>v.authorId!==channel.item_id))throw Error('Wrong author identity in live feed');
          console.log('Live Meir catalog:',{version:response.version,pinnedUc:channel.item_id,videos:videos.length,checkedAt:channel.checked_at,available:response.available!==false});
          if(!videos.length)throw Error('Live Meir catalog still empty after read-through');
          NODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the default Android Studio child project with the checked-in wrapper
        env:
          KIDS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Check identical Gradle packaging and optional old companion regressions
        run: |
          node android/check-bundle.cjs
          cd android
          ./gradlew --no-daemon -PincludeParentCompanion=true :parent:testDebugUnitTest --stacktrace
      - name: Audit Java deprecations and Gradle warnings
        shell: bash
        run: |
          cat > /tmp/kids-audit-lint.init.gradle <<'EOF'
          gradle.beforeProject { project ->
              project.tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs.add('-Xlint:deprecation')
              }
          }
          EOF
          cd android
          ./gradlew --no-daemon --rerun-tasks --warning-mode all \
            --init-script /tmp/kids-audit-lint.init.gradle \
            -PincludeParentCompanion=true \
            :app:compileDebugJavaWithJavac :parent:compileDebugJavaWithJavac
      - name: Verify native reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          counts = {}
          for module in ['app','parent']:
              files = list(Path('android',module,'build/test-results/testDebugUnitTest').glob('*.xml'))
              assert files, f'Missing test reports: {module}'
              count = 0
              for file in files:
                  report = ET.parse(file).getroot()
                  assert all(int(report.get(key,'0')) == 0 for key in ['failures','errors','skipped']), file
                  count += int(report.get('tests','0'))
              counts[module] = count
          assert counts['app'] >= 10 and counts['parent'] >= 25, counts
          print(counts)
          Path('android/native-test-counts.json').write_text(__import__('json').dumps(counts))
          PY
