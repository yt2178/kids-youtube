name: Build Android NewPipe prototype
on:
  push:
    branches: [android-newpipe-proof]
    paths: ['android/**', 'tests/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-newpipe-proof
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Website and bridge regressions
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Native unit tests and APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Test reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-youtube-newpipe-proof
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
      - name: Publish downloadable testing APK
        if: success() && github.ref == 'refs/heads/android-newpipe-proof'
        uses: actions/github-script@v7
        with:
          script: |
            // This job deliberately uses no write token. The artifact above is the
            // testing deliverable; a release upload is a separate publishing job.
            core.summary.addHeading('Android prototype built')
              .addRaw('Source: ' + context.sha + '\n\n')
              .addRaw('Build/tests passed. Physical Android playback is not verified.\n')
              .addRaw('Download the kids-youtube-newpipe-proof artifact and install app-debug.apk.')
              .write();
