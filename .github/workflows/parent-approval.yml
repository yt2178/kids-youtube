name: Save authorized parent approval
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: parent-request-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  approval:
    if: startsWith(github.event.issue.title, '[אישור הורה]') && github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {processApproval,authorized} = require('./scripts/parent-approval.cjs');
            try { await processApproval({github,context}); }
            catch (_) {
              core.setFailed('Parent update could not be completed');
              if(await authorized(github,context.repo,context.payload.issue.user.login)
                && await authorized(github,context.repo,context.payload.sender.login))
                await github.rest.issues.createComment({...context.repo,issue_number:context.payload.issue.number,
                  body:'לא הצלחנו להשלים כרגע. הבקשה נשארה פתוחה. ההורה יכול לנסות שוב באמצעות סגירה ופתיחה מחדש של הבקשה; לא צריך להוסיף את הקישור שוב.'});
            }
