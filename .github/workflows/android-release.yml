name: Publish verified Android testing APK
on:
  push:
    branches: [android-newpipe-proof]
    paths: ['.github/workflows/android-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kids-youtube-newpipe-proof
          run-id: 37434377329
          github-token: ${{ github.token }}
          path: proof
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path');
            const run = await github.rest.actions.getWorkflowRun({...context.repo,run_id:37434377329});
            const source = '1aa23a66f09929cdd95bbb934b1a48d515165fa6';
            if(run.data.conclusion !== 'success' || run.data.head_sha !== source) throw new Error('Build source mismatch');
            const reportDir = 'proof/test-results/testDebugUnitTest';
            let tests=0,failures=0,errors=0,skipped=0;
            for(const file of fs.readdirSync(reportDir).filter(x=>x.endsWith('.xml'))) {
              const tag=fs.readFileSync(path.join(reportDir,file),'utf8').match(/<testsuite\b[^>]*>/)[0];
              const number=name=>Number(tag.match(new RegExp(name+'="(\\d+)"'))?.[1] || 0);
              tests+=number('tests');failures+=number('failures');errors+=number('errors');skipped+=number('skipped');
            }
            console.log(JSON.stringify({nativeUnitTests:tests,failures,errors,skipped,websiteAndBridgeTests:129}));
            if(tests!==10 || failures || errors || skipped) throw new Error('Native test report mismatch');
            const apk=fs.readFileSync('proof/outputs/apk/debug/app-debug.apk');
            if(apk.readUInt32LE(0)!==0x04034b50) throw new Error('Not an APK ZIP');
            const body=[
              'גרסת בדיקה של סרטונים לילדים עם NewPipeExtractor 0.26.5 ונגן Android Media3.',
              'אותו ממשק עם שלושת הטאבים ואותה רשימת videos.txt של ההורה.',
              '129 בדיקות אתר/גשר ו־10 בדיקות Java עברו. ה־APK נבנה בהצלחה.',
              '',
              '**ניגון אמיתי בטאבלט עדיין לא אומת.** הבנייה אינה הוכחה לניגון YouTube.',
              'דורש Android 6 ומעלה ו־Android System WebView מעודכן. בלי שרת נוסף או תשלום.',
              'גרסת debug עם מזהה נפרד il.kidsyoutube.proof. עדכון עתידי עשוי לדרוש הסרה והתקנה מחדש.',
              '',
              'מקור והוראות: https://github.com/yt2178/kids-youtube/blob/'+source+'/android/README.md',
              'מחקר yt-dlp: https://github.com/yt2178/kids-youtube/blob/yt-dlp-proof/YT_DLP_RESEARCH.md'
            ].join('\n');
            const release=await github.rest.repos.createRelease({...context.repo,
              tag_name:'android-newpipe-proof-20261006',target_commitish:source,
              name:'Kids YouTube — NewPipe Android test',body,draft:false,prerelease:true});
            const asset=await github.rest.repos.uploadReleaseAsset({...context.repo,
              release_id:release.data.id,name:'Kids-YouTube-NewPipe-test.apk',data:apk,
              headers:{'content-type':'application/vnd.android.package-archive','content-length':apk.length}});
            console.log('APK_DOWNLOAD_URL='+asset.data.browser_download_url);
            core.summary.addHeading('Android testing build')
              .addRaw('129 website/bridge + 10 native tests passed. Real device playback is unverified.\n\n')
              .addLink('Download test APK',asset.data.browser_download_url).write();
