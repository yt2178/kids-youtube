name: Cloud playback proof
on:
  push:
    branches: [playback-cloud-proof]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-playback-proof
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Check backend syntax
        run: |
          node --check backend/core.mjs
          node --check backend/server.mjs
          node --check backend/youtube.mjs
          node --check backend/live-probe.mjs
      - name: Existing frontend regression tests
        run: node --test tests/*.test.cjs
      - name: Backend approval, HTTP and range tests
        run: npm test --prefix backend
      - name: Install video decoder for real media validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Live approved video, CORS, MP4 bytes and decoded frames
        run: node backend/live-probe.mjs
      - name: Save actual proof result and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-playback-proof
          path: |
            qa/cloud-playback-proof.json
            qa/cloud-proof-frame.png
            backend/package-lock.json
