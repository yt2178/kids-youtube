name: yt-dlp approved-video feasibility proof
on:
  push:
    branches: [yt-dlp-proof]
    paths: ['qa/yt_dlp_probe.py', 'qa/test_yt_dlp_probe.py', '.github/workflows/yt-dlp-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yt-dlp-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned latest stable tool
        run: python -m pip install 'yt-dlp[default]==2026.08.19'
      - name: Verify guard tests and existing website regressions
        run: |
          python -m unittest discover -s qa -p 'test_yt_dlp_probe.py'
          node --test tests/*.test.cjs
      - name: One bounded live approved-video attempt
        run: python qa/yt_dlp_probe.py
      - name: Preserve actual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-actual-proof
          path: qa/yt-dlp-proof.json
          if-no-files-found: warn
