name: Check and deploy static PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run dependency-free tests
        run: node --test tests/app.test.cjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Package the six static app files (no build)
        run: |
          mkdir -p _site/icons
          cp index.html manifest.json sw.js videos.json _site/
          cp icons/icon-192.png icons/icon-512.png _site/icons/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
