<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>הוספת תוכן לילדים — להורה</title><meta name="theme-color" content="#1a1a2e">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.youtube.com; connect-src 'self' https://jxhelpxhrmwvzrrfrjuh.supabase.co; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
<style>
*{box-sizing:border-box}body{margin:0;background:#1a1a2e;color:#faf9ff;font:18px/1.6 system-ui}main{max-width:680px;margin:auto;padding:24px 18px 48px}h1{font-size:clamp(26px,5vw,36px)}p{color:#ccc8dc}.panel{background:#24243c;border:1px solid #48405a;border-radius:24px;padding:22px;margin:20px 0}label{display:block;font-weight:700;margin:12px 0 8px}input,textarea,select,button,.button{font:inherit;border-radius:14px;width:100%;min-height:56px;padding:12px 16px}input,textarea,select{background:#151528;color:white;border:1px solid #625875}textarea{resize:vertical}button,.button{display:block;text-align:center;background:#e94560;color:white;border:0;text-decoration:none;font-weight:700;margin-top:16px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#34314b}a{color:#ffb9c7}img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;background:#34314b}.type{color:#ffb9c7;font-size:22px;font-weight:700}.check{display:flex;gap:12px;align-items:start;font-weight:500}.check input{width:26px;min-height:26px;height:26px;flex-shrink:0;margin-top:5px}[hidden]{display:none!important}:focus-visible{outline:3px solid #ffe389;outline-offset:4px}#status,#auth-status{overflow-wrap:anywhere}small{display:block;color:#c6c0d4}.channel-symbol{font-size:70px;text-align:center}.link{direction:ltr;unicode-bidi:plaintext;overflow-wrap:anywhere}.approved{white-space:pre-wrap;direction:ltr;text-align:left;background:#151528;padding:12px;border-radius:12px;max-height:260px;overflow:auto}
</style><script src="./parent-links.js" defer></script><script src="./parents.js" defer></script></head>
<body><main><h1>הוספה לילדים</h1>
<section id="auth" class="panel"><h2 id="auth-title">כניסת הורה</h2><p id="auth-help">הכניסה נדרשת רק כדי שהילדים לא יוכלו להוסיף תוכן.</p><label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password" maxlength="128"><label class="check"><input id="remember" type="checkbox" checked><span>זכור אותי במכשיר הזה</span></label><button id="login" type="button">כניסה</button><p id="auth-status" role="status"></p></section>
<section id="parent-area" hidden>
<p>ב־YouTube לוחצים ״שיתוף״ → ״העתקת קישור״, מדביקים כאן ובודקים.</p>
<section class="panel"><label for="link">קישור לסרטון או לערוץ</label><textarea id="link" dir="auto" rows="2" maxlength="20000" placeholder="הדביקו כאן את הקישור"></textarea><button id="inspect" type="button">בדיקת הקישור</button><p id="status" role="status" aria-live="polite"></p></section>
<section id="preview" class="panel" hidden><div id="kind" class="type"></div><img id="thumbnail" alt="תמונת הסרטון" hidden><div id="channel-symbol" class="channel-symbol" hidden>📺</div>
<p id="identified"></p><p id="canonical" class="link"></p><a id="verify" class="button secondary" target="_blank" rel="noopener noreferrer">פתיחת התוכן ב־YouTube לבדיקה</a>
<label for="operation">מה עושים?</label><select id="operation"><option value="add">הוספה לרשימה</option><option value="remove">ביטול אישור</option></select>
<p id="channel-warning" hidden>אישור ערוץ מאפשר את כל הסרטונים שלו וגם סרטונים חדשים בעתיד.</p>
<label for="note">הערה לעצמי (לא חובה)</label><input id="note" maxlength="500" placeholder="למשל: סרטון לשעת הפסקה">
<label class="check"><input id="checked" type="checkbox"><span>פתחתי את הקישור ובדקתי שזה הסרטון או הערוץ הרצוי.</span></label>
<button id="save" type="button" disabled>הוסף לילדים</button></section>
<section class="panel"><h2>הרשימה המאושרת</h2><div id="approved" class="approved"></div><button id="refresh-list" class="secondary" type="button">רענון הרשימה</button></section>
<button id="logout" class="secondary" type="button">יציאה</button>
</section></main></body></html>
